name: Generate Snake Contribution Graph

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk@v2
        with:
          github_user_name: practicmakesperfact/practicemakesperfect # Replace with your GitHub username
          output: dist/snake.svg

      - name: Commit and Push Snake SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdir -p output
          mv dist/snake.svg output/snake.svg
          git add output/snake.svg
          git commit -m "Generated snake.svg"
          git push
